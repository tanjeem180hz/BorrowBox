<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" role="img" aria-label="BorrowBox" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="660" height="240" rx="32" fill="#FFFFFF"/>
  <g transform="translate(6,26)" fill="none" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Box body: lower lobe of the B -->
    <path d="M62 96 H114 A31 31 0 0 1 114 158 H62 Z" stroke="#4338CA"/>
    <!-- Lifted lid: upper lobe of the B, offset by a gap to signal an open box / hand-off -->
    <path d="M62 30 H98 A21 21 0 0 1 98 72 H62 Z" stroke="#A5B4FC"/>
  </g>
  <text x="176" y="142" font-family="Nunito, Poppins, 'Segoe UI', 'Arial Rounded MT Bold', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.5" fill="#1E293B">Borrow<tspan fill="#4338CA">Box</tspan></text>
</svg>
