<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" role="img" aria-label="BorrowBox Nearby Sharing - Daffodil International University">
  <defs>
    <!-- Map Surface Gradient (Google Maps Dark Theme) -->
    <linearGradient id="mapSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d26"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <!-- Navigation Route Glow -->
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Marker Glow -->
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes radarPulse {
        0% { r: 8px; opacity: 0.9; stroke-width: 2.5px; }
        70% { opacity: 0.25; }
        100% { r: 36px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes routeDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .pulse-blue {
        animation: radarPulse 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        transform-origin: 730px 420px;
      }
      .pulse-green {
        animation: radarPulse 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.1s;
        transform-origin: 360px 240px;
      }
      .pulse-gold {
        animation: radarPulse 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 0.5s;
        transform-origin: 375px 325px;
      }
      .nav-moving-dash {
        stroke-dasharray: 8 6;
        animation: routeDash 1s linear infinite;
      }
      .hud-float {
        animation: floatSoft 3s ease-in-out infinite;
      }
      .live-dot {
        animation: liveBlink 1.5s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Map Surface -->
  <rect width="880" height="500" rx="16" fill="url(#mapSurface)"/>

  <!-- Waterbodies (Lake Park & Pond based on Google Maps) -->
  <g>
    <!-- Daffodil International University Lake Park (North) -->
    <path d="M 280 85 Q 420 70 540 100 Q 640 125 740 110 Q 770 125 750 145 Q 630 155 530 135 Q 400 110 270 115 Z"
          fill="#132c3f" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="640" y="132" fill="#38bdf8" font-size="9" font-weight="600" opacity="0.7">Lake Park</text>

    <!-- Daffodil University Pond (East) -->
    <path d="M 720 230 C 760 220 785 240 780 275 C 775 305 745 315 715 300 C 695 285 700 245 720 230 Z"
          fill="#132c3f" stroke="#0284c7" stroke-width="1" stroke-opacity="0.35"/>
    <text x="745" y="270" fill="#38bdf8" font-size="8.5" font-weight="600" text-anchor="middle" opacity="0.75">DIU Pond</text>
  </g>

  <!-- DIU Central Playground (Large Green Pitch based on Satellite image) -->
  <g transform="translate(460, 260)">
    <rect width="130" height="120" rx="10" fill="#143122" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Pitch Center Circle & Markings -->
    <circle cx="65" cy="60" r="22" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="65" y1="5" x2="65" y2="115" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="5" y="5" width="120" height="110" rx="8" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2"/>
    <text x="65" y="64" fill="#4ade80" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">DIU CENTRAL PLAYGROUND</text>
  </g>

  <!-- Campus Buildings Blocks (Simplified, Clean Google Maps Style) -->
  <g fill="#212836" stroke="#374151" stroke-width="1.2">
    <!-- DIU Library (Red Pin landmark on Google Maps) -->
    <rect x="315" y="205" width="95" height="65" rx="6" fill="#263145" stroke="#4f46e5" stroke-width="1.5"/>
    
    <!-- Shadhinota Shommelon Kendro (North-West) -->
    <rect x="310" y="130" width="105" height="40" rx="6"/>

    <!-- Department of Innovation & Languages (East of Playground) -->
    <rect x="615" y="260" width="80" height="50" rx="6"/>
    <rect x="615" y="325" width="80" height="45" rx="6"/>

    <!-- Younus Khan Scholar's Garden 1 (YKSG-1 Dormitory - East) -->
    <rect x="685" y="405" width="125" height="55" rx="6" fill="#243042" stroke="#3b82f6" stroke-width="1.2"/>

    <!-- Shahid Minar & Admission Office Plaza (South on DIU Rd) -->
    <rect x="360" y="395" width="50" height="24" rx="4"/>
    <rect x="420" y="395" width="60" height="24" rx="4"/>

    <!-- DIU Golf Cafe (South-West) -->
    <rect x="235" y="425" width="65" height="28" rx="4"/>

    <!-- Rodela Food Court (South-East) -->
    <rect x="580" y="445" width="75" height="30" rx="4"/>
  </g>

  <!-- Landmark Labels (Google Maps typography) -->
  <g fill="#9ca3af" font-size="9" font-weight="600">
    <text x="362" y="242" fill="#c7d2fe" font-size="10" font-weight="700" text-anchor="middle">📚 DIU Library</text>
    <text x="362" y="155" text-anchor="middle">Shadhinota Kendro</text>
    <text x="655" y="290" text-anchor="middle">Dept. of Innovation</text>
    <text x="747" y="435" fill="#93c5fd" font-size="9.5" font-weight="700" text-anchor="middle">🏢 YKSG-1 Hall</text>
    <text x="385" y="411" text-anchor="middle" font-size="8.5">Shahid Minar</text>
    <text x="450" y="411" text-anchor="middle" font-size="8">Admission</text>
    <text x="267" y="442" text-anchor="middle" font-size="8">Golf Cafe</text>
    <text x="617" y="464" text-anchor="middle" font-size="8.5">Rodela Food Court</text>

    <!-- Top Landmarks -->
    <text x="515" y="160" text-anchor="middle">✈️ DIU Airplane</text>
    <text x="475" y="125" text-anchor="middle">কৃষ্ণচূড়া মোড়</text>
  </g>

  <!-- DIU Road Networks (Matching the exact satellite curves) -->
  <!-- Base Road Casing -->
  <g fill="none" stroke="#2c3545" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal Bottom: DIU Rd -->
    <path d="M 40 435 L 840 435" stroke-width="22"/>

    <!-- Road North from Shahid Minar past Library & Playground to Airplane -->
    <path d="M 390 435 L 390 330 L 440 250 L 440 170 L 515 170 L 515 90" stroke-width="16"/>

    <!-- Access Road to DIU Library & Kathal Tola -->
    <path d="M 390 330 L 330 330 L 330 240 L 390 240" stroke-width="14"/>

    <!-- East Branch to Innovation & Pond / YKSG -->
    <path d="M 440 250 L 610 250 L 610 380 L 740 380 L 740 435" stroke-width="14"/>
    <path d="M 610 380 L 530 380 L 530 435" stroke-width="12"/>

    <!-- North Road connecting to Lake Park -->
    <path d="M 515 170 Q 640 170 700 220 L 700 380" stroke-width="12"/>
    <path d="M 390 170 L 260 170 L 260 435" stroke-width="12"/>
  </g>

  <!-- Road Inner Fill (Smooth Asphalt) -->
  <g fill="none" stroke="#3b465a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 40 435 L 840 435" stroke-width="16"/>
    <path d="M 390 435 L 390 330 L 440 250 L 440 170 L 515 170 L 515 90" stroke-width="11"/>
    <path d="M 390 330 L 330 330 L 330 240 L 390 240" stroke-width="9"/>
    <path d="M 440 250 L 610 250 L 610 380 L 740 380 L 740 435" stroke-width="9"/>
    <path d="M 610 380 L 530 380 L 530 435" stroke-width="8"/>
    <path d="M 515 170 Q 640 170 700 220 L 700 380" stroke-width="8"/>
    <path d="M 390 170 L 260 170 L 260 435" stroke-width="8"/>
  </g>

  <!-- Road Center Dashed Line on DIU Rd -->
  <path d="M 45 435 L 835 435" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Road Labels -->
  <text x="140" y="439" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="1">DIU RD</text>
  <text x="790" y="439" fill="#94a3b8" font-size="9" font-weight="700" letter-spacing="1">DIU RD</text>

  <!-- DIU Kathal Tola (Iconic Spot south of Library) -->
  <g transform="translate(365, 325)">
    <circle cx="0" cy="0" r="14" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#34d399"/>
    <text x="0" y="24" fill="#a7f3d0" font-size="9" font-weight="700" text-anchor="middle">🌳 DIU Kathal Tola</text>
  </g>

  <!-- ================= ACTIVE LIVE SHARING ROUTE ================= -->
  <!-- Route: From YKSG-1 Hall (Student A) -> DIU Rd -> up north to Kathal Tola / Library -->
  <!-- Glowing Underlay -->
  <path d="M 730 420 L 730 435 L 390 435 L 390 330 L 375 325"
        fill="none" stroke="#3b82f6" stroke-width="7" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)"/>
  <path d="M 360 240 L 360 310 L 375 325"
        fill="none" stroke="#10b981" stroke-width="7" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)"/>

  <!-- Main Navigation Line -->
  <path d="M 730 420 L 730 435 L 390 435 L 390 330 L 375 325"
        fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 240 L 360 310 L 375 325"
        fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Animated Moving Dashes (Walking Direction towards Handover Spot) -->
  <path d="M 730 420 L 730 435 L 390 435 L 390 330 L 375 325"
        class="nav-moving-dash" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 240 L 360 310 L 375 325"
        class="nav-moving-dash" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radar Pulse Rings -->
  <!-- Student A (YKSG-1) Pulse -->
  <circle cx="730" cy="420" r="10" class="pulse-blue" fill="none" stroke="#60a5fa"/>
  <!-- Student B (Library) Pulse -->
  <circle cx="360" cy="240" r="10" class="pulse-green" fill="none" stroke="#34d399"/>
  <!-- Meetup Spot Pulse -->
  <circle cx="375" cy="325" r="10" class="pulse-gold" fill="none" stroke="#fbbf24"/>

  <!-- ================= MAP PINS & USER MARKERS ================= -->

  <!-- Handover Meetup Point: DIU Kathal Tola -->
  <g transform="translate(375, 325)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#78350f"/>

    <!-- Callout Banner -->
    <g transform="translate(0, -32)">
      <rect x="-85" y="0" width="170" height="24" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="-68" cy="12" r="3.5" fill="#f59e0b" class="live-dot"/>
      <text x="3" y="16" fill="#fef08a" font-size="10" font-weight="800" text-anchor="middle">🎯 Handover: DIU Kathal Tola</text>
    </g>
  </g>

  <!-- Student A Marker (Borrower at YKSG-1 Hall) -->
  <g transform="translate(730, 420)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>

    <!-- Callout Card -->
    <g transform="translate(0, -48)">
      <rect x="-75" y="0" width="150" height="38" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <polygon points="-5,38 5,38 0,43" fill="#0f172a"/>
      <circle cx="-56" cy="19" r="4" fill="#3b82f6"/>
      <text x="-44" y="16" fill="#ffffff" font-size="11" font-weight="700">Student A</text>
      <text x="-44" y="29" fill="#93c5fd" font-size="9" font-weight="600">Borrower · YKSG-1 Hall</text>
    </g>
  </g>

  <!-- Student B Marker (Owner at DIU Library) -->
  <g transform="translate(360, 240)" filter="url(#pinShadow)">
    <circle cx="0" cy="0" r="12" fill="#059669" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>

    <!-- Callout Card -->
    <g transform="translate(0, -48)">
      <rect x="-75" y="0" width="150" height="38" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="-5,38 5,38 0,43" fill="#0f172a"/>
      <circle cx="-56" cy="19" r="4" fill="#10b981"/>
      <text x="-44" y="16" fill="#ffffff" font-size="11" font-weight="700">Student B</text>
      <text x="-44" y="29" fill="#6ee7b7" font-size="9" font-weight="600">Owner · DIU Library</text>
    </g>
  </g>

  <!-- Live Distance Floating HUD Badge -->
  <g transform="translate(510, 395)" class="hud-float" filter="url(#pinShadow)">
    <rect x="0" y="0" width="165" height="34" rx="17" fill="#0b1120" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="4" fill="#34d399" class="live-dot"/>
    <text x="30" y="21" fill="#ffffff" font-size="12" font-weight="800">350 m</text>
    <text x="75" y="21" fill="#94a3b8" font-size="10.5" font-weight="600">· ~3 min walk</text>
  </g>

  <!-- Top Google Maps Header Bar -->
  <g transform="translate(20, 16)">
    <rect width="840" height="42" rx="10" fill="#131926" stroke="#2d3748" stroke-width="1" filter="url(#pinShadow)"/>
    
    <!-- Search / GPS Icon -->
    <circle cx="24" cy="21" r="5" fill="#3b82f6"/>
    <circle cx="24" cy="21" r="2" fill="#ffffff"/>

    <!-- Location Name -->
    <text x="40" y="25" fill="#f3f4f6" font-size="12" font-weight="700">
      Daffodil International University (DIU) · Daffodil Smart City
    </text>

    <!-- Subtitle / Coordinates -->
    <text x="480" y="25" fill="#64748b" font-size="10.5" font-weight="500">
      23.8769° N, 90.3202° E · Live Handover Radar
    </text>

    <!-- ETA Badge -->
    <rect x="735" y="8" width="95" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="782" y="25" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">⏱ ETA: 3 MIN</text>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(26, 485)" fill="#64748b" font-size="9" font-weight="500">
    <text x="0" y="0">📍 Google Maps View · Accurate Campus Footprints · Safe Meeting Zone: DIU Kathal Tola</text>
    <text x="828" y="0" text-anchor="end">BorrowBox Proximity Service · GPS ±3m</text>
  </g>
</svg>
