<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BorrowBox: Complete Product Motion</title>
<link rel="icon" type="image/svg+xml" href="borrowbox-app-icon.svg">
<style>
:root{--bg:#070a16;--ind:#4f46e5;--ind2:#818cf8;--tint:#c7d2fe;--ink:#e8ecff;--mut:#8b93b8;--ok:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#05070f;color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#st{position:relative;width:min(100vw,160vh);aspect-ratio:16/9;font-size:min(1vw,1.6vh);overflow:hidden;background:radial-gradient(60em 40em at 75% 20%,#2a2f8f55,transparent),radial-gradient(50em 40em at 10% 90%,#4f46e533,transparent),var(--bg);border-radius:1em}
.sc{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:7em;padding:0 8em}
.sc.on{display:flex}
.txt{max-width:44em}
.txt h2{font-size:3.6em;line-height:1.12;margin:0 0 .35em;font-weight:700;letter-spacing:-.02em;opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.txt h2:nth-child(2){color:var(--ind2);animation-delay:.9s}
.txt h2:nth-child(3){animation-delay:1.8s}
.ctr{flex-direction:column;text-align:center;gap:1.4em}
.ctr .txt{max-width:70em}
@keyframes up{from{opacity:0;transform:translateY(2.5em)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-1em)}}
.ph{width:17em;height:34em;border-radius:3em;background:#0d1224;border:.35em solid #1e2547;box-shadow:0 3em 6em #000a,0 0 8em #4f46e544;padding:2.2em 1.5em;font-size:1.05em;animation:pop .7s both,fl 5s ease-in-out infinite;display:flex;flex-direction:column;gap:.7em;position:relative;overflow:hidden}
.ph h4{margin:0;font-size:1.25em}.ph small,.mut{color:var(--mut);font-size:.85em}
.card{background:#ffffff10;border:1px solid #ffffff1c;backdrop-filter:blur(8px);border-radius:1.1em;padding:.75em 1em;display:flex;justify-content:space-between;align-items:center;opacity:0;animation:up .6s forwards;font-size:.95em}
.card:nth-child(2){animation-delay:.3s}.card:nth-child(3){animation-delay:.6s}.card:nth-child(4){animation-delay:.9s}.card:nth-child(5){animation-delay:1.2s}
.hl{border-color:var(--ind2);box-shadow:0 0 2em #818cf855}
.btn{background:var(--ind);border-radius:1em;padding:.8em;text-align:center;font-weight:700;animation:pop .5s 1.6s both,pulse 1.6s 2.2s infinite}
.btn.g{background:#059669}.btn.r{background:#dc2626}
@keyframes pulse{50%{box-shadow:0 0 0 .7em #4f46e533}}
.big{font-size:2.2em;font-weight:800;text-align:center}
.st{color:#fbbf24;letter-spacing:.15em;text-align:center}
.qr{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:11em;height:11em;margin:0 auto;position:relative;background:#fff;padding:.6em;border-radius:.8em}
.qr i{background:#fff}.qr i.k{background:#0d1224}
.scan{position:absolute;left:0;right:0;height:.25em;background:var(--ok);box-shadow:0 0 1em var(--ok);animation:sn 1.6s ease-in-out infinite}
@keyframes sn{0%{top:5%}50%{top:92%}100%{top:5%}}
.ok{color:var(--ok);font-weight:700;text-align:center;opacity:0;animation:pop .5s 2s forwards}
.ring{width:12em;height:12em;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .v{stroke:var(--ind2);stroke-dasharray:251;animation:rg 6s linear forwards}
@keyframes rg{from{stroke-dashoffset:40}to{stroke-dashoffset:150}}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.pic{height:6em;border-radius:1em;background:linear-gradient(135deg,#312e81,#6366f1);display:flex;align-items:center;justify-content:center;font-size:2em}
.bd{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center}.bd span{background:#34d39922;color:var(--ok);border-radius:2em;padding:.3em .7em;font-size:.8em;opacity:0;animation:pop .4s forwards}
.bd span:nth-child(2){animation-delay:2.4s}.bd span:nth-child(3){animation-delay:2.8s}.bd span:nth-child(1){animation-delay:2s}
.bd.c span{background:#818cf822;color:var(--tint)}.bd.c span:nth-child(n){animation-delay:.4s}.bd.c span:nth-child(2){animation-delay:.6s}.bd.c span:nth-child(3){animation-delay:.8s}.bd.c span:nth-child(4){animation-delay:1s}.bd.c span:nth-child(5){animation-delay:1.2s}
.lg{display:flex;align-items:center;gap:.5em;font-size:4.6em;font-weight:800;letter-spacing:-.03em;animation:pop .9s both;justify-content:center}
.lg em{color:var(--ind2);font-style:normal}
.orb{position:relative;width:60em;height:8em}
.orb div,.chip{position:absolute;padding:.7em 1.2em;border-radius:1em;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(8px);font-size:1.1em;animation:pop .6s both,fl 5s ease-in-out infinite}
.badge{display:inline-block;border:1px solid #ffffff44;border-radius:.9em;padding:.7em 1.6em;font-weight:700;font-size:1.4em;animation:pop .6s 2.6s both}
.w{position:absolute;left:0;right:0;text-align:center;font-weight:700;opacity:0;animation:w 3.4s both}
@keyframes w{0%{opacity:0;transform:translateY(.6em)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.wb{position:relative;height:1.6em}
.map{position:relative;flex:1;border-radius:1em;background:#111a38;background-image:linear-gradient(#ffffff10 2px,transparent 2px),linear-gradient(90deg,#ffffff10 2px,transparent 2px);background-size:4em 4em;overflow:hidden}
.mi{position:absolute;inset:0;animation:zm 7s ease-in forwards}
@keyframes zm{to{transform:scale(1.6)}}
.pin{position:absolute;top:50%;width:1.3em;height:1.3em;margin:-.65em 0 0 -.65em;border-radius:50%;background:var(--ind2);box-shadow:0 0 0 .5em #818cf844;font-size:.9em}
.pin.o{background:#fbbf24;box-shadow:0 0 0 .5em #fbbf2444;animation:mv 7s ease-in-out forwards}
@keyframes mv{from{left:90%}to{left:36%}}
.rt{position:absolute;top:50%;left:25%;border-top:.25em dashed var(--ind2);animation:rl 7s ease-in-out forwards}
@keyframes rl{from{width:65%}to{width:11%}}
.cmp{position:relative;height:8em;border-radius:1em;overflow:hidden}
.cmp .pic{height:100%;border-radius:0}
.cmp .a{position:absolute;inset:0;background:linear-gradient(135deg,#065f46,#34d399);display:flex;align-items:center;justify-content:center;font-size:2em;animation:cl 3s 1s ease-in-out both}
.cmp .h{position:absolute;top:0;bottom:0;width:.25em;background:#fff;animation:hd 3s 1s ease-in-out both}
@keyframes cl{from{clip-path:inset(0 0 0 92%)}to{clip-path:inset(0 0 0 8%)}}
@keyframes hd{from{left:92%}to{left:8%}}
.flow{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em;max-width:78em;align-items:center}
.flow span{background:#4f46e533;border:1px solid #818cf866;border-radius:2em;padding:.55em 1.1em;font-size:1.3em;font-weight:600;opacity:0;animation:pop .5s both}
.flow b{color:var(--ind2);opacity:0;animation:pop .4s both}
.fe{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em;max-width:78em}
.fe span{background:#ffffff10;border:1px solid #ffffff22;border-radius:.8em;padding:.5em 1em;font-size:1em;color:var(--mut);opacity:0;animation:up .5s both}
</style></head><body>
<div id="st"></div>
<script>
const L=(s=1)=>`<svg width="${4*s}em" height="${4*s}em" viewBox="40 12 130 168" fill="none" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"><path d="M62 96H114A31 31 0 0 1 114 158H62Z" stroke="#6366f1"/><path d="M62 30H98A21 21 0 0 1 98 72H62Z" stroke="#c7d2fe"/></svg>`;
const qr=()=>{let s=7,h='';for(let i=0;i<121;i++){s=(s*73+11)%97;h+=`<i class="${s%2?'k':''}"></i>`}return h};
const C=(a,b,c='',d)=>`<div class="card ${c}"${d!=null?` style="animation-delay:${d}s"`:''}><span>${a}</span><span class="mut">${b}</span></div>`;
const d=s=>`style="animation-delay:${s}s"`;
const LG=`<div class="lg">${L(1)}Borrow<em>Box</em></div>`;
const steps=["Student","Discover","Request","Approve","Meet Nearby","QR Handover","Rental Timer","Return","Payment","Rating","Trust"];
const feats=["Search","Nearby Products","Trust Score","Emergency Requests","Location Sharing","QR Verification","Rental Timer","Condition Check","Payment","Ratings"];
const chips=[["💻 Laptop",4,20],["🧮 Calculator",22,60],["🔌 Charger",42,10],["🔋 Power Bank",62,58],["📷 Camera",80,16]].map(([a,l,t],i)=>`<div style="left:${l}%;top:${t}%;animation-delay:${1.2+i*.3}s,${i*.4}s">${a}</div>`).join('');
const S=[
{t:8,x:["Need something for just a few hours?","Why buy it when you can borrow it?"],p:`<small>🔋 Battery 5%</small>${C('🔌 New Charger','৳1,200','hl',.3)}<div class="big" ${d(.6)} style="animation:up .6s .6s both">৳1,200</div>${C('BorrowBox','৳20 / hour','',2.2)}${C('Duration','2 Hours','',2.8)}<div class="pair" style="animation:pop .6s 4s both;opacity:0"><div class="card" style="opacity:1;animation:none;flex-direction:column"><small>BUY</small><b>৳1,200</b></div><div class="card hl" style="opacity:1;animation:none;flex-direction:column"><small>BORROW</small><b style="color:var(--ok)">৳40</b></div></div>`},
{t:13,c:1,x:["Borrow what you need.","When you need it."],p:0,h:LG,f:`<div class="orb">${chips}</div>`},
{t:19,x:["Built around student-to-student trust."],p:`<h4>Student Profile</h4>${C('🎓 University','Daffodil Int. University','',.2)}${C('Campus','Daffodil Smart City (DSC)','',.4)}${C('Department','CSE (AB-4)','',.6)}${C('Rating','⭐ 4.9','',.8)}<div class="mut" style="text-align:center;margin-top:.5em">Trust Score</div><div class="big" style="color:var(--ind2)"><b class="n" data-v="0,45,72,92" data-d=".8" data-u="3.5">0</b></div><div class="bd"><span>✓ Student</span><span>✓ Verified</span><span>✓ Reliable</span></div>`},
{t:26,x:["Find what you need from students around you."],p:`<div class="card hl" style="animation-delay:0s">🔍 What do you need?</div><div class="bd c"><span>Electronics</span><span>Study</span><span>Accessories</span><span>Camera</span><span>Emergency</span></div>${C('🔌 Laptop Charger','৳20/hour','hl',1.5)}${C('🧮 Sci. Calculator','৳15/hour','',1.9)}${C('🔋 Power Bank','৳25/hour','',2.3)}${C('📷 Camera','৳100/day','',2.7)}`},
{t:33,x:["Choose your time.","Send a request."],p:`<h4>Laptop Charger</h4><div class="st">★★★★★ <small>4.9</small></div>${C('Condition','Excellent','',.2)}${C('Owner · Trust 92','Available Now','',.5)}${C('৳20 / hour','1h · <b>2h</b> · 3h · 1 Day','',.8)}${C('Total','৳40','hl',1.2)}<div class="btn">Request Rental</div>`},
{t:38,x:["Request sent.","Owner accepts."],p:`<div class="ok" style="animation-delay:.3s">✓ Rental Request Sent</div><small style="opacity:0;animation:up .5s 1.4s forwards">🔔 New Rental Request</small>${C('Laptop Charger · 2 Hours','৳40','hl',1.6)}${C('Borrower Trust Score','92','',1.9)}<div class="pair" style="animation:pop .5s 2.2s both"><div class="btn g" style="animation:none">Accept</div><div class="btn" style="animation:none;background:#ffffff18">Reject</div></div>`},
{t:42,x:["Rental Confirmed","Ready for handover."],p:`<div class="big" style="font-size:4.4em;color:var(--ok);animation:pop .6s both">✓</div><div class="big" style="font-size:1.6em">Rental Confirmed</div><div class="mut" style="text-align:center">2 Hours • ৳40</div><div class="pair" style="align-items:center">${C('🧑 You','','',1)}${C('🧑 Other','','',1.4)}</div><div class="mut" style="text-align:center">↔ Ready for handover</div>`},
{t:53,x:["Find each other.","Meet nearby."],p:`<div class="map"><div style="position:absolute;top:.5em;left:.6em;right:.6em;display:flex;justify-content:space-between;font-size:.65em;font-weight:700;color:#60a5fa;background:#0d1224cc;padding:.3em .6em;border-radius:.5em;z-index:2"><span>📍 DIU DSC · MAPS</span><span>23.8769°N, 90.3202°E</span></div><div class="mi"><div class="rt"></div><div class="pin" style="left:25%"></div><div class="pin o"></div></div></div><div class="big"><b class="n" data-v="350,220,110,30" data-d=".3" data-u="6.5" data-s=" m">350 m</b></div><div class="wb"><div class="w" ${d(.3)}>DIU Rd Active · YKSG-1 ↔ Library</div><div class="w" ${d(3.4)}>Meeting Point · DIU Kathal Tola</div><div class="w" ${d(3.4)} hidden></div></div><div class="ok" style="animation-delay:8s">✓ Handover Ready at Kathal Tola</div>`},
{t:59,x:["Secure handover with QR verification."],p:`<h4>Handover Verification</h4><div class="qr">${qr()}<div class="scan"></div></div><div class="ok">✓ Handover Confirmed</div><div class="ok" style="animation-delay:2.8s"><span class="mut">Available</span> → Rented</div>`},
{t:65,x:["Never lose track of your rental."],p:`<div class="ring"><svg viewBox="0 0 100 100" width="100%"><circle cx="50" cy="50" r="40" stroke="#ffffff18"/><circle class="v" cx="50" cy="50" r="40"/></svg><b id="tt">01:59:32</b></div><div class="mut" style="text-align:center">Laptop Charger · ৳20/hour</div><div class="card hl" style="animation-delay:3s"><span>⏰ Rental ending soon</span></div><div class="card" style="animation-delay:4.4s"><span>15 minutes remaining</span></div>`},
{t:72,x:["Time to return.","Check. Verify. Complete."],p:`<div class="big" style="font-size:1.8em">00:00</div><h4 style="text-align:center">Time to Return</h4><div class="pair"><small>Before Rental</small><small style="text-align:right">After Rental</small></div><div class="cmp"><div class="pic">🔌</div><div class="a">🔌</div><div class="h"></div></div><div class="ok" style="animation-delay:4.2s">✓ Condition Checked</div><div class="ok" style="animation-delay:5.2s">Return Confirmed</div>`},
{t:78,x:["Clear pricing.","Transparent history."],p:`${C('Rental Cost','৳40','',.2)}${C('Security Deposit','৳200','',.5)}${C('Total','<b>৳240</b>','hl',.8)}<div class="ok" style="animation-delay:1.4s">✓ Payment Completed</div>${C('⏱ Exceeded by 20 min','Late ৳10','',2.6)}${C('Payment History','Updated','hl',3.4)}`},
{t:84,x:["Every successful rental builds trust."],p:`<h4 style="text-align:center">Rate your experience</h4><div class="st" style="font-size:1.8em;animation:pop .6s .4s both">★★★★★</div><div class="card" style="animation-delay:1.4s"><i>“Smooth handover and great product condition.”</i></div><div class="mut" style="text-align:center">Trust Score</div><div class="big" style="color:var(--ind2)"><b class="n" data-v="92,94" data-d="2.5" data-u="1.5">92</b></div>`},
{t:90,x:["Need it urgently?","Get what you need, when you need it."],p:`<div class="btn r" style="animation-delay:0s">Emergency Request</div><small>Available Nearby</small>${C('🧮 Calculator','350 m (Library)','',1)}${C('🧮 Calculator','180 m (Food Village)','',1.4)}${C('🧮 Calculator','90 m (AB-4)','hl',1.8)}<div class="btn" style="animation-delay:2.6s">Request Sent</div><div class="ok" style="animation-delay:3.6s">✓ Owner Accepted</div>`},
{t:98,c:1,x:["One continuous rental journey."],p:0,f:`<div class="flow">${steps.map((s,i)=>`<span ${d(.8+i*.35)}>${s}</span>${i<10?`<b ${d(1+i*.35)}>→</b>`:''}`).join('')}</div><div class="fe">${feats.map((s,i)=>`<span ${d(5+i*.2)}>${s}</span>`).join('')}</div>`},
{t:104,c:1,x:["Borrow what you need.","When you need it."],p:0,h:LG,f:`<div class="badge" style="animation-delay:2.4s">BorrowBox</div>`}
];
const st=document.getElementById('st'),D=104;
st.innerHTML=S.map(s=>`<section class="sc ${s.c?'ctr':''}">${s.c?`<div class="txt">`:''}${s.h||''}${s.c?'':'<div class="txt">'}${s.x.map(a=>`<h2>${a}</h2>`).join('')}</div>${s.f||''}${s.p?`<div class="ph">${s.p}</div>`:''}</section>`).join('');
const sc=[...st.children];let t=0,cur=-1,last=performance.now();
function show(i){sc.forEach((e,j)=>e.classList.toggle('on',j==i));cur=i}
function tick(n){const dt=Math.min(.1,(n-last)/1000);last=n;t+=dt;if(t>=D)t=0;
let i=S.findIndex(s=>t<s.t);if(i<0)i=S.length-1;if(i!=cur)show(i);
const s0=i?S[i-1].t:0,el=sc[i],tt=el.querySelector('#tt'),T=t-s0;
if(tt){let v=Math.max(1815,7172-T*1071|0);tt.textContent=[v/3600|0,v/60%60|0,v%60].map(x=>String(x).padStart(2,'0')).join(':')}
el.querySelectorAll('.n').forEach(n=>{const v=n.dataset.v.split(',').map(Number),k=Math.min(1,Math.max(0,(T-(+n.dataset.d||0))/(+n.dataset.u||3)))*(v.length-1),j=Math.min(v.length-2,k|0);n.textContent=Math.round(v[j]+(v[j+1]-v[j])*(k-j))+(n.dataset.s||'')});
requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script></body></html>
